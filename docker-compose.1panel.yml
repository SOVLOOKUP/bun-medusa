# Development environment for 1Panel — uses external postgres + redis.
#
# Pulls the pre-built dev image from GHCR. Source code is bind-mounted
# for hot-reload editing.
#
# Usage:
#   1. cp .env.example .env  &&  fill in DB/Redis host + passwords + secrets
#   2. docker compose -f docker-compose.1panel.yml up -d
#   3. open http://<server-ip>:9000/app  (admin, hot-reload)
#
# Prerequisites:
#   - 1Panel has postgres + redis on 1panel-network
#   - PostgreSQL has database `medusa` with user `medusa` granted
#   - ./medusa-app/ will be auto-seeded on first boot (no need to create it)

services:
  medusa:
    image: ghcr.io/sovlookup/bun-medusa:dev
    container_name: medusa_dev_backend
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "9000:9000"   # Backend API + Admin dashboard
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-medusa}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-medusa}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST:-redis}:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt}
      COOKIE_SECRET: ${COOKIE_SECRET:-change_me_cookie}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:5173,http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:5173,http://localhost:8000,http://localhost:9000}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-admin@medusa.local}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-SuperSecret123}
    env_file:
      - .env
    volumes:
      # Source code mount — edit ./medusa-app/src/ on the host, hot-reload in container.
      - ./medusa-app:/app/medusa
      # Keep the container's installed node_modules.
      - medusa_node_modules:/app/medusa/node_modules
    command: ["bun", "run", "dev"]

networks:
  1panel-network:
    external: true

volumes:
  medusa_node_modules:
