# Development environment — source code mount + hot reload.
#
# Brings up postgres + redis + a Medusa dev container that runs
# `medusa develop` with the source code bind-mounted from ./medusa-app.
#
# On first boot the entrypoint automatically seeds ./medusa-app with the
# official starter source, installs dependencies, and creates the admin
# user.  After that you can edit files in ./medusa-app/src/ and the dev
# server hot-reloads instantly.
#
# Usage:
#   1. cp .env.example .env  &&  fill in the secrets
#   2. docker compose -f docker-compose.dev.yml up -d --build
#   3. open http://localhost:5173/app  (admin, hot-reload)
#      open http://localhost:9000/store/products  (store API)
#
# The first build is slow (clones + installs full deps).  Subsequent
# starts are fast — the source and node_modules are cached in volumes.

services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-store
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa_dev_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  medusa:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medusa_dev_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"   # Backend API + Admin dashboard
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-store
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_me_jwt}
      COOKIE_SECRET: ${COOKIE_SECRET:-change_me_cookie}
      STORE_CORS: ${STORE_CORS:-http://localhost:8000}
      ADMIN_CORS: ${ADMIN_CORS:-http://localhost:5173,http://localhost:9000}
      AUTH_CORS: ${AUTH_CORS:-http://localhost:5173,http://localhost:8000,http://localhost:9000}
      MEDUSA_ADMIN_EMAIL: ${MEDUSA_ADMIN_EMAIL:-admin@medusa.local}
      MEDUSA_ADMIN_PASSWORD: ${MEDUSA_ADMIN_PASSWORD:-SuperSecret123}
    volumes:
      # Source code mount — edit ./medusa-app/src/ on the host, hot-reload in container.
      - ./medusa-app:/app/medusa
      # Keep the container's installed node_modules (don't let the bind-mount wipe it).
      - medusa_node_modules:/app/medusa/node_modules
    command: ["bun", "run", "dev"]

volumes:
  pgdata:
  redisdata:
  medusa_node_modules:
