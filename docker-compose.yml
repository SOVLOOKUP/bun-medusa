# docker-compose for the Bun-built Medusa image published to GHCR.
#
# Usage (one command — migrations run automatically on first boot):
#   1. cp .env.example .env  &&  fill in the required secrets
#   2. docker compose up -d
#   3. docker compose run --rm medusa bunx medusa user -e admin@example.com -p YourPassword123
#   4. open http://localhost:9000/app
#
# The image ships a self-contained production build: the admin dashboard is
# compiled into the image and served from http://localhost:9000/app (no
# separate 5173 dev server, no source mount).
#
# Notes:
#   * The bundled entrypoint (docker-entrypoint-medusa.sh) automatically
#     appends ?sslmode=disable&connect_timeout=30 to DATABASE_URL so the
#     default self-hosted plain-TCP Postgres works without a 10 s SSL timeout.
#   * When REDIS_URL is present the same entrypoint also overrides the four
#     memory-backed default modules (cache / event_bus / workflows / locking)
#     with their real Redis implementations.

services:
  postgres:
    image: postgres:16-alpine
    container_name: medusa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medusa-store
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa-store"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  medusa:
    image: ghcr.io/sovlookup/bun-medusa:2.18.0
    container_name: medusa_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      NODE_ENV: production
      # Query params sslmode=disable & connect_timeout=30 are appended
      # automatically by the entrypoint; they do not need to be added here.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/medusa-store
      REDIS_URL: redis://redis:6379
      # Auto-run migrations on boot (idempotent — safe on every restart).
      MEDUSA_AUTO_MIGRATE: "true"
    env_file:
      - .env
    # Persist user uploads / generated files across container restarts.
    volumes:
      - medusa_uploads:/app/uploads

volumes:
  pgdata:
  redisdata:
  medusa_uploads:
