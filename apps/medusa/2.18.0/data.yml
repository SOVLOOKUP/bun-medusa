additionalProperties:
  formFields:
    - default: ""
      envKey: PANEL_DB_HOST
      key: postgres
      label:
        en: Database Service
        zh: 数据库服务
        ja: データベースサービス
        ms: Perkhidmatan Pangkalan Data
        pt-br: Serviço de Banco de Dados
        ru: Сервис базы данных
        ko: 데이터베이스 서비스
        zh-Hant: 資料庫服務
      required: true
      type: service
    - default: medusa
      envKey: PANEL_DB_NAME
      label:
        en: Database Name
        zh: 数据库名
        ja: データベース名
        ms: Nama Pangkalan Data
        pt-br: Nome do Banco de Dados
        ru: Имя базы данных
        ko: 데이터베이스 이름
        zh-Hant: 資料庫名稱
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: medusa
      envKey: PANEL_DB_USER
      label:
        en: Database User
        zh: 数据库用户
        ja: データベースユーザー
        ms: Pengguna Pangkalan Data
        pt-br: Usuário do Banco de Dados
        ru: Пользователь базы данных
        ko: 데이터베이스 사용자
        zh-Hant: 資料庫使用者
      random: true
      required: true
      rule: paramCommon
      type: text
    - default: ""
      edit: true
      envKey: PANEL_DB_USER_PASSWORD
      label:
        en: Database Password
        zh: 数据库密码
        ja: データベースパスワード
        ms: Kata Laluan Pangkalan Data
        pt-br: Senha do Banco de Dados
        ru: Пароль базы данных
        ko: 데이터베이스 비밀번호
        zh-Hant: 資料庫密碼
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      envKey: REDIS_HOST
      key: redis
      label:
        en: Redis Service
        zh: Redis 服务
        ja: Redisサービス
        ms: Perkhidmatan Redis
        pt-br: Serviço Redis
        ru: Сервис Redis
        ko: Redis 서비스
        zh-Hant: Redis服務
      required: true
      type: service
    - default: ""
      edit: true
      envKey: REDIS_PASSWORD
      label:
        en: Redis Password
        zh: Redis 密码
        ja: Redisパスワード
        ms: Kata Laluan Redis
        pt-br: Senha do Redis
        ru: Пароль Redis
        ko: Redis 비밀번호
        zh-Hant: Redis密碼
      required: false
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: JWT_SECRET
      label:
        en: JWT Secret
        zh: JWT 密钥
        ja: JWTシークレット
        ms: Rahsia JWT
        pt-br: Segredo JWT
        ru: Секрет JWT
        ko: JWT 비밀
        zh-Hant: JWT金鑰
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: ""
      edit: true
      envKey: COOKIE_SECRET
      label:
        en: Cookie Secret
        zh: Cookie 密钥
        ja: Cookieシークレット
        ms: Rahsia Cookie
        pt-br: Segredo do Cookie
        ru: Секрет Cookie
        ko: Cookie 비밀
        zh-Hant: Cookie金鑰
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: "9000"
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      label:
        en: HTTP Port
        zh: HTTP 端口
        ja: HTTPポート
        ms: Port HTTP
        pt-br: Porta HTTP
        ru: HTTP порт
        ko: HTTP 포트
        zh-Hant: HTTP埠
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: PUBLIC_URL
      label:
        en: External URL
        zh: 外部访问地址
        ja: 外部URL
        ms: URL Luaran
        pt-br: URL Externa
        ru: Внешний URL
        ko: 외부 URL
        zh-Hant: 外部訪問地址
      required: true
      rule: paramExtUrl
      type: text
    - default: admin@medusa.local
      edit: true
      envKey: MEDUSA_ADMIN_EMAIL
      label:
        en: Admin Email
        zh: 管理员邮箱
        ja: 管理者メール
        ms: E-mel Pentadbir
        pt-br: Email do Administrador
        ru: Email администратора
        ko: 관리자 이메일
        zh-Hant: 管理員電子郵件
      required: true
      rule: paramCommon
      type: text
    - default: ""
      edit: true
      envKey: MEDUSA_ADMIN_PASSWORD
      label:
        en: Admin Password
        zh: 管理员密码
        ja: 管理者パスワード
        ms: Kata Laluan Pentadbir
        pt-br: Senha do Administrador
        ru: Пароль администратора
        ko: 관리자 비밀번호
        zh-Hant: 管理員密碼
      random: true
      required: true
      rule: paramComplexity
      type: password
