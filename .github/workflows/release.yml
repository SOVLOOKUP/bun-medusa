name: Release

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

env:
  APP_NAME: medusa
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "version=v0.0.1-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          echo "version_no_v=${VERSION_NO_V}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MEDUSA_VERSION=${{ steps.version.outputs.version_no_v }}

  smoke-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa_password
          POSTGRES_DB: medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Get release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "version=v0.0.1-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Medusa container
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
          echo "Pulling and running $IMAGE ..."
          docker run -d --name medusa-test \
            -p 9000:9000 \
            -e DATABASE_URL="postgres://medusa:medusa_password@localhost:5432/medusa?sslmode=disable" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="supersecret" \
            -e COOKIE_SECRET="supersecret" \
            -e MEDUSA_ADMIN_EMAIL="admin@test.com" \
            -e MEDUSA_ADMIN_PASSWORD="supersecret123" \
            "$IMAGE"

          echo "Waiting for Medusa to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "Medusa is healthy!"
              curl -s http://localhost:9000/health
              exit 0
            fi
            # Check if container is still running
            if ! docker ps | grep -q medusa-test; then
              echo "Container exited early. Logs:"
              docker logs medusa-test
              exit 1
            fi
            echo "  attempt $i/60 - waiting..."
            sleep 5
          done

          echo "Medusa did not become healthy within 5 minutes."
          echo "=== Container logs ==="
          docker logs medusa-test 2>&1 | tail -50
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs medusa-test 2>&1 | tail -80

      - name: Cleanup
        if: always()
        run: docker rm -f medusa-test || true

  build-package:
    needs: [build-and-push, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "version=v0.0.1-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          else
            echo "version=v$(date +%Y%m%d)" >> $GITHUB_OUTPUT
          fi

      - name: Update image reference in docker-compose.yml
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          IMAGE_REF="ghcr.io/${{ github.repository }}:${VERSION}"

          echo "Updating image reference to: ${IMAGE_REF}"
          sed -i "s|ghcr.io/REPLACE_ME/bun-medusa:2.18.0|${IMAGE_REF}|g" apps/${APP_NAME}/2.18.0/docker-compose.yml
          cat apps/${APP_NAME}/2.18.0/docker-compose.yml

      - name: Validate app structure
        run: |
          if [ ! -d "apps/${APP_NAME}" ]; then
            echo "::error::App directory apps/${APP_NAME} not found"
            exit 1
          fi

          if [ ! -f "apps/${APP_NAME}/data.yml" ]; then
            echo "::error::App metadata data.yml not found"
            exit 1
          fi

          if [ ! -f "apps/${APP_NAME}/2.18.0/data.yml" ]; then
            echo "::error::Version data.yml not found for 2.18.0"
            exit 1
          fi

          if [ ! -f "apps/${APP_NAME}/2.18.0/docker-compose.yml" ]; then
            echo "::error::docker-compose.yml not found for 2.18.0"
            exit 1
          fi

          echo "App structure validated successfully for version 2.18.0"

      - name: Package as tar.gz
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          PACKAGE_NAME="${APP_NAME}-${VERSION_NO_V}-1panel.tar.gz"

          cd apps
          tar czf ../${PACKAGE_NAME} ${APP_NAME}/
          cd ..

          echo "Created ${PACKAGE_NAME}"
          ls -lh ${PACKAGE_NAME}

      - name: Package as zip
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_NO_V="${VERSION#v}"
          PACKAGE_NAME="${APP_NAME}-${VERSION_NO_V}-1panel.zip"

          cd apps
          zip -r ../${PACKAGE_NAME} ${APP_NAME}/
          cd ..

          echo "Created ${PACKAGE_NAME}"
          ls -lh ${PACKAGE_NAME}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-app-${{ steps.version.outputs.version }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
