name: Release

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

env:
  APP_NAME: medusa
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # ── Resolve versions from Dockerfile.prod ─────────────────────────
  get-versions:
    runs-on: ubuntu-latest
    outputs:
      medusa_version: ${{ steps.versions.outputs.medusa_version }}
      docker_tag: ${{ steps.versions.outputs.docker_tag }}
      release_tag: ${{ steps.versions.outputs.release_tag }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
      channel: ${{ steps.versions.outputs.channel }}
      short_sha: ${{ steps.versions.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        run: |
          # Read MEDUSA_VERSION build arg from Dockerfile.prod (single source of truth)
          MEDUSA_VERSION=$(grep -m1 '^ARG MEDUSA_VERSION=' Dockerfile.prod \
            | cut -d'=' -f2 \
            | tr -d '[:space:]' \
            | tr -d '"')
          echo "medusa_version=${MEDUSA_VERSION}" >> $GITHUB_OUTPUT
          echo "Parsed MEDUSA_VERSION=${MEDUSA_VERSION} from Dockerfile.prod"

          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "release" ]; then
            # Release event: use the tag the user created
            RELEASE_TAG="${{ github.event.release.tag_name }}"
            # Strip optional 'v' prefix for docker tag
            DOCKER_TAG="${RELEASE_TAG#v}"
            PRERELEASE="false"
            CHANNEL="stable"
          else
            # Push or dispatch: build a tagged edge pre-release aligned
            # with the Medusa version (e.g. 2.18.0-a1b2c3d)
            RELEASE_TAG="v${MEDUSA_VERSION}-edge"
            DOCKER_TAG="${MEDUSA_VERSION}-${SHORT_SHA}"
            PRERELEASE="true"
            CHANNEL="edge"
          fi

          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "prerelease=${PRERELEASE}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

          echo "Resolved versions:"
          echo "  medusa_version: ${MEDUSA_VERSION}"
          echo "  docker_tag:     ${DOCKER_TAG}"
          echo "  release_tag:    ${RELEASE_TAG}"
          echo "  prerelease:     ${PRERELEASE}"
          echo "  channel:        ${CHANNEL}"
          echo "  short_sha:      ${SHORT_SHA}"

  # ── Build and push multi-arch Docker image ────────────────────────
  build-and-push:
    needs: get-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Docker tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Version-aligned primary tag (e.g. 2.18.0 or 2.18.0-a1b2c3d)
            type=raw,value=${{ needs.get-versions.outputs.docker_tag }}
            # Channel aliases: "latest" for stable releases, "edge" for edge builds
            type=raw,value=latest,enable=${{ needs.get-versions.outputs.channel == 'stable' }}
            type=raw,value=edge,enable=${{ needs.get-versions.outputs.channel == 'edge' }}
            # Pure Medusa version tag (overwritten on each build for that Medusa version line)
            type=raw,value=${{ needs.get-versions.outputs.medusa_version }}
            # Immutable SHA tag
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MEDUSA_VERSION=${{ needs.get-versions.outputs.medusa_version }}

  # ── Build and push dev image (for hot-reload development) ─────────
  build-and-push-dev:
    needs: get-versions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Docker tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=raw,value=dev-${{ needs.get-versions.outputs.short_sha }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MEDUSA_VERSION=${{ needs.get-versions.outputs.medusa_version }}

  # ── Smoke test the freshly pushed image ───────────────────────────
  smoke-test:
    needs: [get-versions, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      packages: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa_password
          POSTGRES_DB: medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Medusa container
        run: |
          REPO_LC="${{ github.repository }}"
          REPO_LC="${REPO_LC,,}"
          IMAGE="ghcr.io/${REPO_LC}:${{ needs.get-versions.outputs.docker_tag }}"
          echo "Pulling and running $IMAGE ..."
          docker run -d --name medusa-test \
            --network host \
            -e DATABASE_URL="postgres://medusa:medusa_password@localhost:5432/medusa?sslmode=disable" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="supersecret" \
            -e COOKIE_SECRET="supersecret" \
            -e MEDUSA_ADMIN_EMAIL="admin@test.com" \
            -e MEDUSA_ADMIN_PASSWORD="supersecret123" \
            "$IMAGE"

          echo "Waiting for Medusa to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "Medusa is healthy!"
              curl -s http://localhost:9000/health
              exit 0
            fi
            if ! docker ps | grep -q medusa-test; then
              echo "Container exited early. Logs:"
              docker logs medusa-test
              exit 1
            fi
            echo "  attempt $i/60 - waiting..."
            sleep 5
          done

          echo "Medusa did not become healthy within 5 minutes."
          echo "=== Container logs ==="
          docker logs medusa-test 2>&1 | tail -50
          exit 1

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs medusa-test 2>&1 | tail -80

      - name: Cleanup
        if: always()
        run: docker rm -f medusa-test || true

  # ── Smoke test the freshly pushed DEV image ───────────────────────
  smoke-test-dev:
    needs: [get-versions, build-and-push-dev]
    runs-on: ubuntu-latest
    permissions:
      packages: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medusa
          POSTGRES_PASSWORD: medusa_password
          POSTGRES_DB: medusa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medusa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Medusa dev container
        run: |
          REPO_LC="${{ github.repository }}"
          REPO_LC="${REPO_LC,,}"
          IMAGE="ghcr.io/${REPO_LC}:dev"
          echo "Pulling and running $IMAGE ..."
          docker run -d --name medusa-dev-test \
            --network host \
            -e DATABASE_URL="postgres://medusa:medusa_password@localhost:5432/medusa?sslmode=disable" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="supersecret" \
            -e COOKIE_SECRET="supersecret" \
            -e MEDUSA_ADMIN_EMAIL="admin@test.com" \
            -e MEDUSA_ADMIN_PASSWORD="supersecret123" \
            "$IMAGE"

          # Dev server boots Vite + TS source watchers, so allow up to ~8 min
          echo "Waiting for Medusa dev server to start..."
          for i in $(seq 1 96); do
            if curl -sf http://localhost:9000/health > /dev/null 2>&1; then
              echo "Medusa dev server is healthy!"
              curl -s http://localhost:9000/health
              break
            fi
            if ! docker ps | grep -q medusa-dev-test; then
              echo "Container exited early. Logs:"
              docker logs medusa-dev-test
              exit 1
            fi
            echo "  attempt $i/96 - waiting..."
            sleep 5
            if [ "$i" -eq 96 ]; then
              echo "Medusa dev server did not become healthy within 8 minutes."
              echo "=== Container logs ==="
              docker logs medusa-dev-test 2>&1 | tail -80
              exit 1
            fi
          done

          # Verify Vite admin dev server accepts custom Host headers
          # (regression check for "Blocked request" without allowedHosts).
          echo "Checking admin Vite host validation..."
          ADMIN_RESP=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Host: medusa.example.com" \
            http://localhost:9000/app/ 2>&1 || true)
          ADMIN_BODY=$(curl -s -H "Host: medusa.example.com" \
            http://localhost:9000/app/ 2>&1 || true)
          echo "Admin /app/ with custom Host → HTTP $ADMIN_RESP"
          if echo "$ADMIN_BODY" | grep -qi "Blocked request\|is not allowed"; then
            echo "::error::Admin Vite dev server still blocks custom Host headers"
            echo "Response body:"
            echo "$ADMIN_BODY" | head -20
            echo "=== Container logs ==="
            docker logs medusa-dev-test 2>&1 | tail -40
            exit 1
          fi
          echo "Admin Vite accepts custom Host headers — allowedHosts patch verified."

          # Verify the i18n virtual module resolves successfully (regression
          # check for "Failed to resolve import ... Does the file exist?"
          # which causes a blank admin page at runtime even though /app/ 200s).
          # Vite exposes \0-prefixed virtual modules via the /@id/__x00__ prefix
          # (URL-encode NUL).  The admin Vite middleware is mounted under /app/.
          echo "Checking admin i18n virtual module..."
          I18N_RESP=$(curl -s -o /tmp/i18n-out.txt -w "%{http_code}" \
            -H "Host: medusa.example.com" \
            http://localhost:9000/app/@id/__x00__virtual:medusa/i18n 2>&1 || true)
          I18N_BODY=$(cat /tmp/i18n-out.txt 2>/dev/null || echo "")
          echo "Admin i18n virtual module → HTTP $I18N_RESP"
          if [ "$I18N_RESP" != "200" ] || ! echo "$I18N_BODY" | grep -qE "export default|resources.*i18nTranslations0"; then
            echo "::error::Admin i18n virtual module failed to resolve (HTTP $I18N_RESP). This causes a BLANK admin page."
            echo "Response body (first 500 chars):"
            echo "$I18N_BODY" | head -c 500
            echo
            echo "=== Container logs (last 80) ==="
            docker logs medusa-dev-test 2>&1 | tail -80
            exit 1
          fi
          echo "Admin i18n virtual module resolves successfully — no blank-page regression."

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Container logs ==="
          docker logs medusa-dev-test 2>&1 | tail -120

      - name: Cleanup
        if: always()
        run: docker rm -f medusa-dev-test || true

  # ── Build 1Panel app package + attach to release ──────────────────
  build-package:
    needs: [get-versions, build-and-push, smoke-test, smoke-test-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure versioned 1Panel app directory exists
        run: |
          set -euo pipefail
          MEDUSA_VER="${{ needs.get-versions.outputs.medusa_version }}"
          APP_DIR="apps/${APP_NAME}"
          TARGET_DIR="${APP_DIR}/${MEDUSA_VER}"

          if [ -d "${TARGET_DIR}" ] && [ -f "${TARGET_DIR}/data.yml" ] && [ -f "${TARGET_DIR}/docker-compose.yml" ]; then
            echo "Using existing versioned app directory: ${TARGET_DIR}"
            exit 0
          fi

          if [ ! -d "${APP_DIR}" ]; then
            echo "::error::App directory ${APP_DIR} not found"
            exit 1
          fi

          # ── Pick the most recent existing version directory as template ──
          # shellcheck disable=SC2012
          TEMPLATE_DIR=$(
            ls -1 "${APP_DIR}" \
              | awk '/^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$/' \
              | sort -V \
              | tail -n1
          ) || true

          if [ -z "${TEMPLATE_DIR}" ] || [ ! -d "${APP_DIR}/${TEMPLATE_DIR}/data.yml" ] || [ ! -d "${APP_DIR}/${TEMPLATE_DIR}/docker-compose.yml" ]; then
            echo "::error::No existing versioned template directory under ${APP_DIR} to seed ${TARGET_DIR}"
            exit 1
          fi

          echo "Seeding ${TARGET_DIR} from template ${APP_DIR}/${TEMPLATE_DIR} (Medusa release bump)"
          cp -a "${APP_DIR}/${TEMPLATE_DIR}" "${TARGET_DIR}"

          # The template docker-compose.yml uses the pattern `ghcr.io/REPLACE_ME/bun-medusa:<OLD_VER>`
          # as a placeholder that build-package then rewrites to the real image ref.  Rewrite the
          # old version token so the placeholder stays aligned with the new MEDUSA_VER (it's still
          # a placeholder — this is purely cosmetic for anyone inspecting the repo tree).
          if grep -qE 'ghcr\.io/REPLACE_ME/bun-medusa:[0-9]+\.[0-9]+\.[0-9]+' "${TARGET_DIR}/docker-compose.yml"; then
            sed -i -E "s|ghcr\.io/REPLACE_ME/bun-medusa:[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|ghcr.io/REPLACE_ME/bun-medusa:${MEDUSA_VER}|g" \
              "${TARGET_DIR}/docker-compose.yml"
          fi

          echo "Seeded template directory contents preview:"
          ls -la "${TARGET_DIR}"

      - name: Update image reference in docker-compose.yml
        run: |
          MEDUSA_VER="${{ needs.get-versions.outputs.medusa_version }}"
          DOCKER_TAG="${{ needs.get-versions.outputs.docker_tag }}"
          REPO_LC="${{ github.repository }}"
          REPO_LC="${REPO_LC,,}"
          IMAGE_REF="ghcr.io/${REPO_LC}:${DOCKER_TAG}"

          echo "Updating image reference to: ${IMAGE_REF}"
          # Match any version placeholder currently sitting in the template; not just 2.18.0.
          sed -i -E "s|ghcr\.io/REPLACE_ME/bun-medusa:[^\"'[:space:]]+|${IMAGE_REF}|g" \
            "apps/${APP_NAME}/${MEDUSA_VER}/docker-compose.yml"
          cat "apps/${APP_NAME}/${MEDUSA_VER}/docker-compose.yml"

      - name: Validate app structure
        run: |
          MEDUSA_VER="${{ needs.get-versions.outputs.medusa_version }}"
          if [ ! -d "apps/${APP_NAME}" ]; then
            echo "::error::App directory apps/${APP_NAME} not found"
            exit 1
          fi
          if [ ! -f "apps/${APP_NAME}/data.yml" ]; then
            echo "::error::App metadata data.yml not found"
            exit 1
          fi
          if [ ! -f "apps/${APP_NAME}/${MEDUSA_VER}/data.yml" ]; then
            echo "::error::Version data.yml not found for ${MEDUSA_VER}"
            exit 1
          fi
          if [ ! -f "apps/${APP_NAME}/${MEDUSA_VER}/docker-compose.yml" ]; then
            echo "::error::docker-compose.yml not found for ${MEDUSA_VER}"
            exit 1
          fi
          echo "App structure validated successfully for version ${MEDUSA_VER}"

      - name: Package as tar.gz
        run: |
          DOCKER_TAG="${{ needs.get-versions.outputs.docker_tag }}"
          PACKAGE_NAME="${APP_NAME}-${DOCKER_TAG}-1panel.tar.gz"

          cd apps
          tar czf ../${PACKAGE_NAME} ${APP_NAME}/
          cd ..

          echo "Created ${PACKAGE_NAME}"
          ls -lh ${PACKAGE_NAME}

      - name: Package as zip
        run: |
          DOCKER_TAG="${{ needs.get-versions.outputs.docker_tag }}"
          PACKAGE_NAME="${APP_NAME}-${DOCKER_TAG}-1panel.zip"

          cd apps
          zip -r ../${PACKAGE_NAME} ${APP_NAME}/
          cd ..

          echo "Created ${PACKAGE_NAME}"
          ls -lh ${PACKAGE_NAME}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 1panel-app-${{ needs.get-versions.outputs.docker_tag }}
          path: |
            *.tar.gz
            *.zip
          retention-days: 30

      - name: Create/update GitHub release and attach packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-versions.outputs.release_tag }}
          prerelease: ${{ needs.get-versions.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.get-versions.outputs.channel == 'stable' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.tar.gz
            *.zip
          body: |
            ## 1Panel 应用包 — Medusa ${{ needs.get-versions.outputs.medusa_version }}

            对应 Docker 镜像：`ghcr.io/${{ github.repository }}:${{ needs.get-versions.outputs.docker_tag }}`

            Commit: `${{ needs.get-versions.outputs.short_sha }}` · 通道: `${{ needs.get-versions.outputs.channel }}`

            ### 安装说明
            1. 下载 `.tar.gz` 或 `.zip`
            2. 在 1Panel 应用商店 → 本地安装 → 选择该文件
            3. 按表单填写 PostgreSQL / Redis / 管理员信息后提交
