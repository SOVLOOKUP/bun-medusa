name: release

# Automatically tracks the latest medusajs/medusa release and rebuilds the
# Bun-built Docker image. The track job polls the npm registry on a schedule,
# bumps `.medusa-version` and tags `v<version>` when a new release is detected,
# then the build job builds and pushes the image to GHCR.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Medusa version to build (e.g. 2.18.0). Empty = auto-detect latest.'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.medusa-version'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  packages: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      changed: ${{ steps.resolve.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest Medusa version
        id: resolve
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            latest="${{ inputs.version }}"
          else
            latest=$(curl -fsSL https://registry.npmjs.org/@medusajs/medusa/latest | jq -r '.version')
          fi
          if [ -z "${latest}" ] || [ "${latest}" = "null" ]; then
            echo "::error::Could not resolve a Medusa version"
            exit 1
          fi
          current=""
          if [ -f .medusa-version ]; then current="$(tr -d '[:space:]' < .medusa-version)"; fi
          echo "version=${latest}" >> "$GITHUB_OUTPUT"
          if [ "${latest}" != "${current}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "New Medusa version detected: ${current:-<none>} -> ${latest}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Medusa version unchanged at ${latest}"
          fi

      - name: Bump .medusa-version & tag
        if: steps.resolve.outputs.changed == 'true'
        run: |
          set -euo pipefail
          v="${{ steps.resolve.outputs.version }}"
          branch="${{ github.event.repository.default_branch }}"
          echo "${v}" > .medusa-version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .medusa-version
          git commit -m "chore: track medusa v${v}"
          git push origin "HEAD:${branch}"
          if ! git rev-parse "v${v}" >/dev/null 2>&1; then
            git tag "v${v}"
            git push origin "v${v}"
          fi

  build:
    needs: track
    if: ${{ needs.track.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      # Check out the default branch tip so we pick up the .medusa-version commit
      # the track job may have just pushed in this same run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve version
        id: ver
        env:
          TRACKED: ${{ needs.track.outputs.version }}
        run: |
          v="${TRACKED}"
          if [ -z "${v}" ]; then v="$(tr -d '[:space:]' < .medusa-version)"; fi
          echo "v=${v}" >> "$GITHUB_OUTPUT"

      - name: Compute image name and tags
        id: meta
        env:
          VERSION: ${{ steps.ver.outputs.v }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(echo "${REPO}" | tr '[:upper:]' '[:lower:]')"
          v="${VERSION}"
          minor="$(echo "${v}" | cut -d. -f1-2)"
          major="$(echo "${v}" | cut -d. -f1)"
          {
            echo "image=${image}"
            echo "tags<<EOF"
            echo "${image}:${v}"
            echo "${image}:${minor}"
            echo "${image}:${major}"
            echo "${image}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Default to amd64 for reliable, fast builds. Enable arm64 by setting
          # the repo variable PLATFORMS=linux/amd64,linux/arm64.
          platforms: ${{ vars.PLATFORMS || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            MEDUSA_VERSION=${{ steps.ver.outputs.v }}
          labels: |
            org.opencontainers.image.title=medusa-bun
            org.opencontainers.image.description=Medusa backend auto-built with Bun, tracking the latest medusajs/medusa release
            org.opencontainers.image.source=https://github.com/medusajs/medusa
            org.opencontainers.image.version=${{ steps.ver.outputs.v }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
